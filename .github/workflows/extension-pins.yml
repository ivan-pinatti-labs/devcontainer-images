---
name: Extension Pins

# Once a week, checks whether the VS Code extensions baked into the workbench
# have newer stable releases that are at least seven days old, and keeps one
# issue open while any are due. It changes nothing itself: extensions run with
# the editor's full permissions, so a person reads every bump and runs
# `scripts/extension-pins.py --update` (docs/LAYERS.md, "Extensions").

on:
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: extension-pins
  cancel-in-progress: false

jobs:
  check:
    name: Check the extension pins
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          title="VS Code extension updates are due"
          status=0
          scripts/extension-pins.py --check > due.txt || status=$?
          existing="$(gh issue list --state open \
            --search "in:title \"${title}\"" \
            --json number --jq '.[0].number // empty')"
          case "${status}" in
            0)
              if [ -n "${existing}" ]; then
                gh issue close "${existing}" --comment "Every pin is current again."
              fi
              ;;
            1)
              {
                echo "Stable releases at least seven days old, for the extensions in"
                echo "\`images/workbench/vscode/extensions.txt\`:"
                echo
                echo '```text'
                cat due.txt
                echo '```'
                echo
                echo "Read each extension's changes, then run"
                echo "\`l2 --net -- scripts/extension-pins.py --update\` in the workbench"
                echo "and open a pull request."
              } > body.md
              if [ -n "${existing}" ]; then
                gh issue edit "${existing}" --body-file body.md
              else
                gh issue create --title "${title}" --body-file body.md --label dependencies
              fi
              ;;
            *)
              cat due.txt
              exit "${status}"
              ;;
          esac
