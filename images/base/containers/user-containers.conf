# Per user containers.conf for the 'dev' account, installed as
# ~/.config/containers/containers.conf.
#
# Nested containers bind mount this container's /proc instead of mounting a
# fresh procfs: mounting a new one from inside a rootless container is refused
# ("crun: mount `proc` to `proc`: Operation not permitted", measured
# 2026-09-15). default_sysctls is emptied because its default entries are
# network namespace sysctls, and nested containers share the development
# container's network namespace (see /etc/containers/containers.conf), so
# there is no namespace of their own to set them in.
#
# Both settings mirror the official quay.io/podman/stable image's own user
# configuration.
[containers]
volumes = [
  "/proc:/proc",
]
default_sysctls = []
