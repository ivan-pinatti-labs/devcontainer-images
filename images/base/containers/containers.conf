# System containers.conf for the podman that runs inside this image.
#
# These settings mirror the official quay.io/podman/stable image's own
# configuration for running podman inside a container, and were verified to
# work on top of this image on 2026-09-15.
#
# "host" in the namespace settings means this development container's own
# namespaces, not the machine it runs on: nested containers share the
# development container's network, IPC and UTS namespaces rather than each
# getting a new set.
#
# cgroups are disabled and the cgroupfs manager is used because there is no
# systemd inside this container to delegate cgroups from. Events go to a file
# for the same reason: there is no journal to send them to.
[containers]
netns = "host"
userns = "host"
ipcns = "host"
utsns = "host"
cgroupns = "host"
cgroups = "disabled"
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"

# The crun podman runs here is crun-without-masked-paths, a wrapper that
# removes masked paths from each nested container's spec before calling
# /usr/bin/crun; the wrapper's own header says why they have to go.
#
# The crun entry's path points at the wrapper rather than the wrapper being
# registered as a runtime of its own. A runtime under any other name is
# refused with cgroups disabled ("requested OCI runtime ... is not compatible
# with NoCgroups", measured 2026-09-15, even with that name added to
# runtime_supports_nocgroups), while this way podman still sees crun.
[engine.runtimes]
crun = ["/usr/local/libexec/devcontainer/crun"]
