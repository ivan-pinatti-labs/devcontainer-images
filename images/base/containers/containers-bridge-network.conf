# Opt in override that gives each nested container a network namespace of its
# own on podman's default bridge network, instead of the development
# container's shared one (see containers.conf).
#
# Not read unless a repository points CONTAINERS_CONF_OVERRIDE at it, and only
# useful when that development container is also started with
# --device /dev/net/tun and --security-opt unmask=/proc/sys. docs/IMAGES.md,
# "Nested containers with a network of their own", says why each is needed.
[containers]
netns = "bridge"
