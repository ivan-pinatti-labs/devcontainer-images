# Storage for the podman that runs inside this image.
#
# Overlay through fuse-overlayfs rather than the kernel's own overlay mounts,
# the same choice the official quay.io/podman/stable image makes for podman
# inside a container. It is also why a development container that nests
# containers has to be started with /dev/fuse passed in.
#
# No graphroot or runroot here: the 'dev' account is rootless, so its images
# and containers live under its own home directory, which is where podman
# puts them by default.
[storage]
driver = "overlay"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
mountopt = "nodev,fsync=0"
