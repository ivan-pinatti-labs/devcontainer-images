# Only CONNECT to port 443 of an allowlisted host. Nothing is cached and TLS is
# not inspected: the allow decision is made on the host name the client asks
# for, which is why the allowlist stays short (docs/LAYERS.md, "Network").
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 200
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterDefaultDeny Yes
FilterURLs Off
ConnectPort 443
LogLevel Connect
